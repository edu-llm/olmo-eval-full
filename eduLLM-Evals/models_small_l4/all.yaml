# Small-cluster (<2B) tutor roster — 27 models.
#
# This is the <2B slice of the 63-model "82 minus the 19 TutorEval-overlap"
# subset (AdaptiveTesting/Inputs/Models/tutor_run_82_minus_19.yaml on Research).
# Intended for RESPONSE GENERATION ONLY (no grading) on TutorEval + BiGGen,
# sharded across a few single-GPU L4 jobs (see scripts/aws/run_respgen_small_l4.sh
# and the shard{1..4}.yaml manifests beside this file).
#
# registry.py derives apply_chat_template / gated / backend / architecture /
# max_model_len from the id, so entries need only `id` (+ params_b metadata).
# All 27 are ungated open-weight HF causal LMs; trust_remote_code is applied by
# the backends where needed (StableLM-2, Falcon3, Qwen3).

defaults:
  max_model_len_cap: 32768      # hard ceiling; clamped down to each model's own limit
  max_new_tokens: 4096          # output budget (bounds base-model rambling)
  tensor_parallel_size: 1       # one <2B model per L4; parallelism is across models/shards
  scoring_method: generate
  temperature: 0.0              # deterministic decode for construct validity
  top_p: 1.0                    # inert at temperature 0
  repetition_penalty: 1.1       # low + uniform; still shifts argmax at temp 0
  seed: 0

models:
  - {id: EleutherAI/pythia-70m, params_b: 0.07}
  - {id: openai-community/gpt2, params_b: 0.124}
  - {id: HuggingFaceTB/SmolLM2-135M, params_b: 0.135}
  - {id: EleutherAI/pythia-160m, params_b: 0.16}
  - {id: openai-community/gpt2-medium, params_b: 0.355}
  - {id: HuggingFaceTB/SmolLM2-360M-Instruct, params_b: 0.36}
  - {id: EleutherAI/pythia-410m, params_b: 0.41}
  - {id: Qwen/Qwen2.5-0.5B, params_b: 0.494}
  - {id: bigscience/bloom-560m, params_b: 0.56}
  - {id: Qwen/Qwen3-0.6B, params_b: 0.752}
  - {id: openai-community/gpt2-large, params_b: 0.77}
  - {id: EleutherAI/pythia-1b, params_b: 1}
  - {id: tiiuae/Falcon3-1B-Base, params_b: 1}
  - {id: TinyLlama/TinyLlama-1.1B-Chat-v1.0, params_b: 1.1}
  - {id: bigscience/bloom-1b1, params_b: 1.1}
  - {id: facebook/opt-1.3b, params_b: 1.3}
  - {id: EleutherAI/pythia-1.4b, params_b: 1.4}
  - {id: Qwen/Qwen2-1.5B, params_b: 1.5}
