# Small-cluster <2B — L4 shard 4 of 4 (6 models). Size-balanced round-robin of
# models_small_l4/all.yaml. Run on one L4 (see scripts/aws/run_respgen_small_l4.sh).
defaults:
  max_model_len_cap: 32768
  max_new_tokens: 768           # P1-3: no tutor turn needs 4k; 4k mostly financed loops
  tensor_parallel_size: 1
  scoring_method: generate
  temperature: 0.0
  top_p: 1.0
  repetition_penalty: 1.15      # P1-3: 1.1 too weak; small base models loop
  seed: 0

models:
  - {id: HuggingFaceTB/SmolLM2-1.7B-Instruct, params_b: 1.7}
  - {id: Qwen/Qwen2.5-1.5B-Instruct, params_b: 1.5}
  - {id: facebook/opt-1.3b, params_b: 1.3, repetition_penalty: 1.3}
  - {id: EleutherAI/pythia-1b, params_b: 1, repetition_penalty: 1.3}
  - {id: Qwen/Qwen2.5-0.5B, params_b: 0.494}
  - {id: EleutherAI/pythia-160m, params_b: 0.16, repetition_penalty: 1.3}
