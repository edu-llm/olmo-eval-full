# Small-cluster <2B — L4 shard 2 of 4 (7 models). Size-balanced round-robin of
# models_small_l4/all.yaml. Run on one L4 (see scripts/aws/run_respgen_small_l4.sh).
defaults:
  max_model_len_cap: 32768
  max_new_tokens: 768           # P1-3: no tutor turn needs 4k; 4k mostly financed loops
  tensor_parallel_size: 1
  scoring_method: generate
  temperature: 0.0
  top_p: 1.0
  repetition_penalty: 1.15      # P1-3: 1.1 too weak; small base models loop
  seed: 0

models:
  - {id: bigscience/bloom-1b7, params_b: 1.7}
  - {id: stabilityai/stablelm-2-1_6b, params_b: 1.6}
  - {id: Qwen/Qwen2-1.5B, params_b: 1.5}
  - {id: TinyLlama/TinyLlama-1.1B-Chat-v1.0, params_b: 1.1}
  - {id: Qwen/Qwen3-0.6B, params_b: 0.752}
  - {id: HuggingFaceTB/SmolLM2-360M-Instruct, params_b: 0.36}
  - {id: openai-community/gpt2, params_b: 0.124, repetition_penalty: 1.3}
