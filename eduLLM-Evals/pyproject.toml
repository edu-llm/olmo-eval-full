[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor-cat"
version = "0.1.0"
description = "CAT-driven MIRT evaluation pipeline for LLM tutors (LLM-judge graded, per PRD)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "openai>=1.40",
    "anthropic>=0.34",
    "google-genai>=1.0",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Response-generation runtime (GPU host only — vllm/torch have no Windows wheels).
# The respgen pure modules (manifest/registry/prompts/records/shard) don't need
# these; only backends/runner/orchestrator/s3 import them, lazily.
gen = [
    "vllm>=0.6",
    "transformers>=4.44",
    "huggingface_hub>=0.24",
    "torch>=2.4",
    "accelerate>=0.33",
    "boto3>=1.34",
]

[project.scripts]
tutor-cat = "tutor_cat.cli:main"

[tool.setuptools.packages.find]
include = ["tutor_cat*"]
