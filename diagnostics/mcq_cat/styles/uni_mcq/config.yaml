# Configuration for the uni_mcq CAT style.
#
# The runner's --se-threshold and --max-items override se_threshold and max_items when
# supplied; min_items has no CLI flag and is always read from here.
style: uni_mcq

# Stop once every administered-item count and precision condition is met:
#   step >= min_items AND se <= se_threshold
# Initial state is theta = 0, se = 1, so the min_items floor always binds first.
se_threshold: 0.3
min_items: 8

# Per-dataset overrides of min_items, folded on by the same mechanism the two grading
# blocks use for prompt_style and score_normalization. A dataset absent from here runs
# on the shared floor above, which is every bank but one.
#
# min_items is the only key permitted here. se_threshold and max_items are deliberately
# not: both already have a CLI flag and both are recorded per run, and a second, quieter
# way to move them per dataset would make two runs of one bank incomparable with nothing
# in either report to say why.
#
# Deliberately not part of the recorded scoring convention either. That block covers
# settings that decide whether an individual item is answered correctly; this one decides
# only how many items there are, so a bank vendored under one floor and run under another
# is still comparable in everything but test length, which the report already carries.
datasets:
  bbh:
    # 24, the number of subtasks the bank spans, against 8 everywhere else.
    #
    # BBH's filtered discriminations are inflated -- median 3.99 against roughly 1.4 for
    # gpqa and musr -- because a unidimensional fit over 24 unrelated skills pushes the
    # loading onto whatever separates models overall. The posterior standard error
    # therefore collapses immediately: upstream's CAT reaches SE <= 0.3 in an average of
    # 8.2 items, the fewest of any bank, and 8 items cannot touch a third of the suite.
    #
    # 24 is the smallest floor under which touching every subtask is arithmetically
    # possible. It is above the 15.4 items upstream needed even at SE <= 0.1, so
    # precision alone would never reach it, and below max_items 40, so a session that
    # still needs items can still take them.
    #
    # What it does not do, and neither of these should be glossed. It does not guarantee
    # subtask coverage: Fisher-information selection takes whatever is most informative
    # at the current theta and may draw heavily from a few subtasks, and content
    # balancing exists neither here nor in Research. And it does not improve the
    # estimate: BBH's theta_mae is 0.684 at SE <= 0.3 and 0.711 at SE <= 0.1, flat
    # because the model is wrong for the benchmark rather than because the test is short.
    min_items: 24

# Pinned at 40, matching the runner's default and run_checkpoint_diag.sh's MAX_ITEMS,
# so an ordinary invocation is already comparable without passing an extra flag.
#
# 40 is what Research's live CAT actually administers. Its library default is 200
# (DEFAULT_MAX_ITEMS in src/olmo_eval/adaptive/cat.py on origin/Research), but every
# launcher that drives that CAT overrides it: scripts/atlas_cat_diagnose/launch_g6.sh
# and run_worker.sh, and .cursor/skills/add-cat-evals/scripts/run_cat_diagnostic.sh,
# all pass se_stop=0.3 min_items=8 max_items=40. Matching the launchers rather than the
# library default is what makes a theta from here comparable with a published one.
#
# The value is still recorded per run rather than assumed, since a run under the 200
# default is not comparable with one under 40. Every report carries max_items and
# whether it matched this pin.
max_items: 40

# Settings for the log-likelihood grader, used only when the resolved bank's modality is
# `mcq`. Generative banks ignore this block entirely.
#
# Every key must be a field of common/inference.py's InferenceConfig, except the
# `datasets` map; an unknown key raises rather than being ignored.
#
# Two keys matter and both are per dataset rather than shared, because the MCQ tasks on
# this branch disagree about both. Each defines its own `format_request`, and each
# declares the metric its bank was calibrated under; an item's difficulty is a statement
# about one presentation and one comparison rule, and EAP treats it as fixed, so a
# benchmark scored behind another's framing or ranked by another's rule has the whole
# difference absorbed into theta. MCQ_PROMPT_STYLES and MCQ_SCORE_NORMALIZATIONS in
# common/inference.py hold the layouts and the rules; the entries below say which pair
# each benchmark takes.
#
# score_normalization is omitted wherever the unnormalized sum is right, which is the
# default and is what three of these six take. It is spelled out for musr, bbh and gpqa,
# so the exception is visible where it applies rather than restated three times where it
# does not. The first two take it because their tasks declare
# LogprobPerCharMCAccuracyMetric; gpqa takes it on the leaderboard's authority rather than
# the task's, which is a weaker warrant and is spelled out in its entry.
mcq:
  datasets:
    # olmo-eval's shared evals/tasks/common/format_helpers.format_rc, which
    # src/olmo_eval/evals/tasks/arc.py uses for its non-MC branch:
    #   "Question: {stem}\nAnswer:" + " {choice}"
    arc_challenge:
      prompt_style: question_answer

    # hellaswag.py's _format_rc returns the query with no answer cue at all. Its
    # contexts end mid-clause by construction ("... A man is sitting on a roof. He"),
    # so the choice is the grammatical completion of the stem and anything inserted
    # between the two breaks it on essentially every item.
    hellaswag:
      prompt_style: bare_context

    # winogrande.py's RC branch is Trinh & Le (2018) partial evaluation: the candidate
    # is substituted into the blank *inside* the prompt and the scored continuation is
    # the text after the blank, identical for both choices. Two things ride on this.
    # It is the only formulation that measures coreference rather than which name more
    # plausibly follows an answer cue in a sentence containing both. And because the
    # continuations come out byte-identical, an unnormalized sum is length-invariant by
    # construction -- scoring the options as continuations instead hands the item to
    # whichever option is shorter.
    winogrande:
      prompt_style: blank_substitution

    # lm-evaluation-harness's leaderboard_musr, which is what the bank was calibrated
    # under; Research has no MuSR task to match against. The narrative and question,
    # then the choices numbered from one, then a blank line and an `Answer:` cue, with
    # the choice *text* as the scored continuation.
    musr:
      prompt_style: musr
      # acc_norm, the metric musr.py declares (LogprobPerCharMCAccuracyMetric) and the
      # one Open LLM Leaderboard v2 reported MuSR under. Its choices are whole clauses
      # of very unequal length -- an object_placements item can weigh a six-word answer
      # against a twenty-word one -- so an unnormalized sum would decide a large share
      # of the bank on token count alone, against difficulties fit on the normalized
      # binary. Our divisor is one character longer than lm-eval's, matching the repo's
      # own per-character metric rather than inventing a second one; see PerCharacterMean.
      score_normalization: continuation_logprob_per_character

    # The only style here that adds nothing to the stem, because the stem is already the
    # whole prompt. lm-evaluation-harness's leaderboard_bbh is 3-shot behind a one-line
    # description that differs per *subtask*, and this map is per dataset, so there is no
    # entry that could express it. Vendoring calls each bbh task's own format_request and
    # freezes the rendered prompt -- description, three fixed exemplars, the item and its
    # trailing `A:` cue -- into the item's stem. All that is left is to append
    # ` {choice}`. It is the last bank that does this; gpqa froze its shuffled choice
    # block the same way while it was generative and now ships a real choice list.
    #
    # The style's num_fewshot is 3, not 0, and that is recorded in the manifest: 0 would
    # describe a prompt no model is shown, and the mismatch a stem-framing style would
    # produce here is what refuses a config edit that dropped the prefix.
    bbh:
      prompt_style: bbh
      # acc_norm, the metric bbh.py declares (LogprobPerCharMCAccuracyMetric) and the one
      # Open LLM Leaderboard v2 reported BBH under. It matters more here than the choice
      # lengths suggest: most subtasks rank bare option letters of equal length, where
      # the two rules agree, but object_counting ranks "0" against "18" and
      # boolean_expressions "True" against "False", and those the divisor decides.
      score_normalization: continuation_logprob_per_character

    # lm-evaluation-harness's leaderboard_gpqa, which is what this bank was calibrated
    # under and is deliberately *not* what the registered olmo-eval task does. The task
    # defaults to chat plus chain of thought and offers log-likelihood only as a `:mc`
    # variant, and that variant is a third convention again: it writes "A. choice" labels
    # with no framing sentence and no answer cue, and ranks the choice *text* under a
    # plain AccuracyMetric. Neither is the presentation these difficulties were estimated
    # behind, so neither is reproduced here. See calibrated_datasets/DEVIATIONS.md.
    #
    # The layout is taken from the leaderboard's own recorded arguments rather than from
    # the template that generated them:
    #   "What is the correct answer to this question:{question}\n\nChoices:\n(A) ...
    #    \n(D) ...\nAnswer: " + " (A)"
    # The missing space after "question:" and the two-space gap at the cue are upstream's
    # and are kept; see LetteredChoicesStyle.
    gpqa:
      prompt_style: gpqa
      # acc_norm, which is what Open LLM Leaderboard v2 reported GPQA under and what
      # `metric_list` in lm-eval's leaderboard/gpqa/_template_yaml declares. Named on the
      # leaderboard's authority rather than the olmo-eval task's, which is the weaker of
      # the two warrants the other acc_norm banks have: gpqa_*:mc declares an unnormalized
      # AccuracyMetric, so the task and the harvest disagree and the harvest is what the
      # difficulties came from. Against these continuations the rule is nearly inert in
      # any case -- the four scored spans are " (A)".." (D)", four characters each -- so it
      # divides every choice by the same number and can only change a ranking through
      # tokenizer edge cases. It is set because the calibration set it, not because it
      # decides items.
      score_normalization: continuation_logprob_per_character

# Settings for the generative grader, used only when the resolved bank's modality is
# `generative`. MCQ banks ignore this block entirely.
#
# Every key must be a field of common/generative.py's GenerationConfig, except the
# `datasets` map below; an unknown key raises rather than being ignored, because a
# silently-dropped setting means scoring under a convention nobody chose.
#
# The values below reproduce olmo-eval's gsm8k task (src/olmo_eval/evals/tasks/gsm8k.py)
# so a diagnostic run and a full eval of the same checkpoint ask for the same thing.
generative:
  # 8-shot with the fixed GSM8K examples. The setting most worth leaving alone: item
  # difficulties were estimated from models answering under some prompt, and EAP treats
  # `b` as fixed, so a harder prompt here is absorbed entirely into theta -- a uniformly
  # depressed score with a healthy-looking standard error.
  #
  # 8 is the olmo-eval task's value. It is not known to be ATLAS's: no shot count is
  # recorded anywhere upstream, and the harvested population is Open LLM Leaderboard v1,
  # whose GSM8K convention is 5-shot. See fewshot_examples() in common/generative.py.
  num_fewshot: 8
  max_new_tokens: 512
  # Greedy decoding. Nonzero is rejected rather than ignored: the bank was calibrated on
  # single greedy completions, and sampling would make one checkpoint score differently
  # from run to run.
  temperature: 0.0
  # Applied locally after generation, since a local `generate` has no stop handling.
  # A blank line is the boundary the few-shot block teaches between questions, and the
  # extractor takes the *last* number, so without these a run-on answer would be graded
  # on a hallucinated next question.
  stop_sequences: ["Question:", "\n\n"]

  # Per-dataset overrides of the keys above, folded on by common/grading.py using the
  # resolved bank's name. A dataset absent from here runs on the shared keys alone.
  #
  # This exists because the keys above are gsm8k's convention, not a house style, and
  # two generative benchmarks calibrated under different prompts cannot share one. A
  # MATH item answered behind gsm8k's `Question:`/`Answer:` framing would be scored
  # against a difficulty estimated under `Problem:`/`Solution:`, and EAP would absorb
  # the whole difference into theta.
  datasets:
    # Reproduces olmo-eval's leaderboard_math task
    # (src/olmo_eval/evals/tasks/leaderboard_math.py).
    leaderboard_math:
      # 4-shot with the fixed Minerva examples. As with gsm8k, the count the bank was
      # actually calibrated under is not recoverable: the upstream math calibration
      # directory holds parameter CSVs, response matrices and figures, and no record of
      # how the responses were prompted. 4 is the olmo-eval task's value and is also
      # the count Open LLM Leaderboard v2 publishes for MATH-Hard, which is where this
      # bank's response data was harvested -- so the two are likely to agree, but that
      # is inferred from the harvest rather than stated by the bank.
      num_fewshot: 4
      fewshot_source: leaderboard_math
      # `Problem:\n...\n\nSolution:`. The framing also teaches the \boxed{} and
      # `Final Answer:` endings that the symbolic grader extracts; under gsm8k's
      # framing a model states its answer in prose and the grader finds nothing.
      prompt_style: leaderboard_math
      # 2048 = the longest reference solution in this bank, 1,901 tokens, plus 7.7% and rounded up
      # to a power of two. Derived 2026-08-08 from the 1,183 vendored items joined back to
      # DigitalLearningGmbH/MATH-lighteval on problem text -- a 1,183 of 1,183 join -- and tokenized
      # with HuggingFaceTB/SmolLM2-135M, the identifier .edullm/run.yaml names. Median 255, mean
      # 329, p90 658, p99 1,151, max 1,901 at item 913cf4f81371230a, an intermediate_algebra Level-5
      # proof seven times the median length.
      #
      # It is deliberately NOT derived from metadata["gold_answer"], which is where a reader looks
      # first and is the wrong field. This bank's gold is the bare final answer -- "4.5",
      # "\frac{2}{5}", 32 tokens at the longest, and \boxed appears in none of the 1,183 -- because
      # process_doc extracted it before vendoring. A budget fit to that field would be 320 tokens
      # under any sane headroom and would cut most responses off mid-derivation.
      #
      # Why not 1536, which the stop sequence would justify. ["Problem:", "\n\n"] ends a completion
      # at the first blank line and 42.3% of these reference solutions contain one, so the longest
      # text the grader can actually receive is 1,442 tokens. 2048 is set instead so this value does
      # not depend on the line below it.
      #
      # Cost at the cacheless rate TORCH_TODOS.md measured, 31.25 ms/token: 64 s per item that never
      # stops early, 42.7 minutes for a 40-item session against the 1h olmo-core-check bound.
      # Realised cost is well under that. Do not round back to 1024 to reclaim the margin: 26 of the
      # 1,183 references exceed 1024 and 5 of those are a single unbroken block, so the cut lands on
      # correct answers rather than on run-on text.
      #
      # Amended 2026-08-08 in the same commit that changed the stop below. The third paragraph
      # describes a stop sequence this file no longer sets, so read it as the derivation as it
      # stood: with ["Problem:"] alone there is no 1,442-token ceiling and the grader can receive a
      # whole 1,901-token solution. The paragraph's conclusion is unchanged and is now load-bearing
      # rather than precautionary -- 2048 was chosen not to depend on the stop, and the stop moved.
      # Nothing else in the derivation moves either: the cost figures are already per item that runs
      # to the cap, and removing a stop can only add items that do.
      max_new_tokens: 2048
      # ["Problem:"] and not ["Problem:", "\n\n"]. Changed 2026-08-08. This diverges from the
      # olmo-eval task named above, which sets ("Problem:", "\n\n"), and matches
      # lm-evaluation-harness's leaderboard_math instead -- `until: ["Problem:"]`, do_sample false,
      # temperature 0, max_gen_toks 1024. The bank settles which one to follow: these difficulties
      # were harvested from Open LLM Leaderboard v2, which *is* that lm-eval task, so no model in
      # the calibration population was ever cut at a blank line.
      #
      # The blank line was destroying answers rather than bounding them. MathLatexEquivalence
      # grades through olmo_eval.evals.extract.math.extract_math_answer, and both of its extraction
      # paths read the end of a solution: last_boxed_only_string does `string.rfind("\boxed")`, and
      # get_unnormalized_answer matches the "Final Answer: The final answer is X" line that the
      # Minerva block teaches as the last line. Cut at the first blank line and neither survives.
      # Measured over the 1,324 Level-5 MATH-lighteval solutions this bank is drawn from: 594
      # (44.9%) contain a blank line, and for 541 of them -- 40.9% of the bank -- truncation removes
      # the boxed answer and the Final Answer line together. extract_math_answer then falls all the
      # way through to normalizing the truncated derivation and returning that as the answer. A
      # median 32.7% of the solution survives the cut and the worst case leaves 0.3%. The completion
      # also trips the "no \boxed{} answer" warning, which reads as the prompt convention failing to
      # take, so the harness's own truncation gets logged as the model's formatting failure.
      #
      # The run-on hazard the shared block above names is real, and "Problem:" alone covers it. The
      # few-shot block teaches `Problem:` as the header of the next question, so a model that runs
      # on into a hallucinated one emits it and is cut there, and "Problem:" appears in 0 of the
      # 1,324 reference solutions -- unlike a blank line it cannot fire inside a legitimate answer.
      # What it does not cover is a run-on that never emits the header, and that residual is the
      # trade this line makes. The two sides are not symmetric. Losing the answer is a certain false
      # negative on 40.9% of the bank; the run-on is a possible false positive, and a bounded one,
      # because extract_math_answer puts the *first* Final Answer line in the candidate list --
      # get_unnormalized_answer is a re.search -- and MathLatexEquivalence accepts any equivalent
      # candidate. A run-on can add a spurious candidate; it cannot displace an answer the model
      # already stated correctly.
      #
      # The exemplars point the other way and were checked, because they would have justified
      # keeping the stop. None of the four solutions in olmo_eval's MINERVA_MATH_FIXED_FEWSHOT
      # contains a blank line, so the prompt this harness sends does teach that one ends an answer.
      # lm-eval's copy of the same four -- list_fewshot_samples() in leaderboard/math/utils.py -- is
      # not de-blank-lined: its fourth solution has two, around the $$...$$ displays. So the
      # leaderboard showed the calibration population a blank line mid-solution and did not stop on
      # one, while olmo-eval removed them and did. Inheriting only olmo-eval's half of that pair is
      # what made the stop look safe here.
      stop_sequences: ["Problem:"]

    # Reproduces olmo-eval's ifeval task (src/olmo_eval/evals/tasks/ifeval.py), which
    # is the Open LLM Leaderboard v2 configuration.
    ifeval:
      # 0-shot, and not a default inherited from anywhere: an IFEval prompt states its
      # own constraints, and a worked example would add constraints the verifiers were
      # never told about while burning tokens the response needs. The ifeval prompt
      # template declares no fewshot_answer_key, so a nonzero count here raises rather
      # than borrowing gsm8k's block.
      num_fewshot: 0
      prompt_style: ifeval
      # A raw completion prompt, which is a deviation from the olmo-eval task
      # (RequestType.CHAT) and is deliberate. It was `true` until this branch, on the
      # reasoning that the bank was calibrated on instruction-tuned models answering a
      # bare instruction. That reasoning turned out to describe only part of the
      # harvest, and the harvest is readable.
      #
      # The bank was fit over 1,102 Open LLM Leaderboard v2 models, and the leaderboard
      # applies a chat template per submission -- automatically for chat models, not for
      # pretrained ones. Its own per-example records show both framings on one IFEval
      # document (doc_id 0, key 1000): meta-llama/Meta-Llama-3-8B, a pretrained
      # submission, was sent the prompt verbatim, while microsoft/Phi-3-mini-4k-instruct
      # -- the run this bank's bridge ordering was rebuilt from -- was sent
      # "<|user|>\n...<|end|>\n<|assistant|>\n". Both under identical generation kwargs:
      # until [], do_sample false, temperature 0, max_gen_toks 1280.
      #
      # So neither value matches the whole bank and the choice is which half to match.
      # False matches lm-evaluation-harness's leaderboard_ifeval exactly -- its
      # `doc_to_text` is the bare `prompt` field and the template is applied outside the
      # task, by --apply_chat_template -- and it is the only value under which a base
      # checkpoint can be scored at all, since a checkpoint with no chat template is
      # refused rather than sent one. The scale shift against the chat-templated half of
      # the harvest is real; it is recorded in the bank's calibration note and in
      # calibrated_datasets/DEVIATIONS.md rather than absorbed silently into theta.
      chat_format: false
      # 1280, and for this one bank it is a CEILING rather than the budget. Changed 2026-08-08
      # from a flat 1536.
      #
      # Two separate changes landed on this key at once, and they pull in opposite directions:
      # the number went DOWN to match the calibration harness, and the budget an item actually
      # gets went down further still, because a per-item cascade now lowers most items below it.
      # Nothing raises an item above it.
      #
      # Why 1280. It is the value the population that produced these difficulties generated
      # under: src/olmo_eval/evals/tasks/ifeval.py line 66 sets max_tokens=1280, lm-eval's
      # leaderboard_ifeval sends max_gen_toks 1280, and Open LLM Leaderboard v2 runs lm-eval.
      # Theta is only interpretable on the scale the difficulties came from, which is the same
      # argument that settles leaderboard_math at its upstream 1024.
      #
      # It is a HARNESS CONVENTION AND NOT A PAPER VALUE, and should not be described as one.
      # The IFEval paper (arXiv 2311.07911) specifies no generation cap at all, and the
      # google-research reference implementation consumes a JSONL of prompt/response pairs, so
      # generation is the caller's business and upstream never had to pick a number. 1280 is
      # what the harnesses picked; matching it is a calibration-parity decision, not fidelity
      # to a specification.
      #
      # What being a ceiling costs, recorded because it is a real loss rather than a rounding
      # one. 7 items declare constraints that convert to more than 1280 -- ab5ca590f2d20f37
      # (2,500 words) wants 3,367 tokens, 15f8a656391c0cd5 2,120, and five more between 1,310
      # and 1,442. They are truncated, deliberately, at exactly the point the calibration
      # population was truncated. The alternative -- letting the cascade raise them above the
      # harness value -- would score them on a scale no fitted model was measured on.
      #
      # Where the budget actually comes from now: generative.ifeval_token_budget, which holds the
      # whole derivation. In brief, and only ever downward from 1280:
      #   * an item's declared length signals are converted to tokens and the largest wins, plus
      #     a 50-token headroom so an over-run is visible rather than prevented;
      #   * 84 items that declare no size AND carry only constraints that survive being cut short
      #     drop to a 208-token floor (4x the ~52-token median demand measured for such items,
      #     which independently equals 3x their own p90 prompt length);
      #   * every item whose grade depends on the response FINISHING keeps the full 1280 --
      #     generative.TRUNCATION_FRAGILE_IDS, 263 items, ending-dependent ones like
      #     startend:end_checker and count-dependent ones like keywords:frequency. Cutting those
      #     fails a constraint the model was in the middle of satisfying, which is the same
      #     failure class as the MATH blank-line stop that deleted 40.9% of answers;
      #   * the 31 language:response_language items keep the full 1280 too, because every
      #     conversion constant is an English measurement and a non-English response costs 2x to
      #     22x more tokens per word (Thai 158x, being unspaced).
      #
      # Words are converted to tokens by the EVALUATED CHECKPOINT'S OWN tokenizer, measured at
      # run time, so no ratio is written here: that would be a model property in a benchmark
      # file. With no tokenizer the cascade does not run at all and every item takes this flat
      # 1280, because a words-to-tokens ratio guessed for an unknown tokenizer is exactly the
      # quiet approximation the budget exists to remove. A third stage then clamps the result to
      # the checkpoint's context window; it is inert for this bank above a 1,636-token window
      # (the longest prompt is 356 tokens) and exists for future small-context submitters.
      #
      # What the change costs and buys, over the whole 511-item bank at 31.25 ms/token (the
      # cacheless rate TORCH_TODOS.md measured), budgets measured on SmolLM2's tokenizer:
      #   flat 1536:   784,896 tokens   40-item session 32.0 min
      #   flat 1280:   654,080 tokens   40-item session 26.7 min   (the ceiling change alone)
      #   per item:    427,802 tokens   40-item session 17.4 min   (1.83x cheaper than 1536)
      #   distribution: min 76, p25 242, median 1280, mean 837, max 1280
      #   257 items sit at the ceiling, 84 at the floor, 254 (49.7%) strictly below 1280
      # The median is AT the ceiling, which is the honest headline: half the bank is a
      # correctness case that must not be shortened, and the saving comes from the other half.
      #
      # This bank does pay its full budget on every item, because stop_sequences below is [] and
      # this checkpoint never emits eos (measured, probe run_019fe316-0e47; see TORCH_TODOS.md), so
      # these are realised figures rather than worst cases. That is also why the saving is real
      # rather than notional: a bank that stopped on its own would not have been overspending.
      max_new_tokens: 1280
      # Deliberately empty, and it stays empty here even though a run appends to it.
      #
      # Empty for the original reason first. Every other generative bank here stops at a
      # blank line because its few-shot block teaches that as the boundary between
      # questions. IFEval has no few-shot block and asks for multi-paragraph answers, so
      # that stop would cut most responses after one paragraph and fail their length and
      # section constraints -- scoring the harness's truncation as the model's mistake.
      # Both upstream harnesses agree: olmo-eval's ifeval task sets SamplingParams with no
      # stop strings at all, and lm-eval's leaderboard_ifeval sends `until: []`.
      #
      # What a run adds, and why it is not written here. generative.eos_stop_sequences
      # appends the *running checkpoint's own end-token text*, resolved from its live
      # tokenizer, to the list the scorer uses. That string is a property of the
      # checkpoint and this file is a property of the benchmark, so writing it down would
      # make the bank's recorded convention checkpoint-specific and refuse every model
      # that spells its end token differently. The manifest records [] for the same
      # reason, and the guard over it stays honest because [] is genuinely what the
      # benchmark declares.
      #
      # It buys no compute. truncate_at_stop runs over an already-finished completion, so
      # max_new_tokens above is the whole of the compute bound; this only keeps text out
      # of the graded span. The case it catches is a model emitting the literal characters
      # of its end marker as ordinary vocabulary tokens rather than as the special token,
      # which skip_special_tokens does not remove, leaving `<|endoftext|>` inside the
      # response the verifiers read. 93 of the 511 items are decided by how the response
      # ends -- startend:quotation (40), startend:end_checker (26),
      # detectable_format:json_format (17), detectable_format:constrained_response (10) --
      # and a trailing marker fails all four on a response that satisfied them.
      #
      # It is suppressed for the 24 combination:two_responses items, where cutting at the
      # first occurrence would delete the second response and fail the very constraint
      # being checked. That costs nothing: 0 of those 24 carry any of the four
      # end-anchored constraints. The full argument, the rejected alternatives and the
      # residual risk are on generative.eos_stop_sequences.
      stop_sequences: []

    # NOTE: gpqa had an entry here and no longer does. It is now an `mcq` bank; see the
    # entry under the mcq block above and the DEVIATIONS.md section for the change.
    #
    # What was here reproduced the registered olmo-eval task's own default -- 0-shot chat
    # with the expert-scientist system turn, chain of thought, "ANSWER: X" extracted by
    # the gpqa_cot_letter grader. That was defensible while the task's default was the
    # only description of the convention anyone had, and it cost the bank its
    # reachability: a chain of thought needs a chat template, and a base checkpoint has
    # none, so the entry made a bank that exists unrunnable for the checkpoints this
    # harness is pointed at.
    #
    # It is gone rather than commented out because it was also, on the evidence, the
    # wrong convention. These difficulties came from Open LLM Leaderboard v2, whose GPQA
    # is lm-evaluation-harness's leaderboard_gpqa: `output_type: multiple_choice`, four
    # letters ranked by log-likelihood under acc_norm at 0-shot with no system prompt for
    # any submission, base or chat. The task's default was never what the parameters were
    # fit against, so leaving it available as a flag would leave a way to score this bank
    # under a convention now known to be a different one.
    #
    # The generative machinery it used is still registered and still tested --
    # generative.GPQACoTLetter, the "gpqa" prompt template and system prompt -- because it
    # remains a correct implementation of the registered task, and because a future bank
    # calibrated on that task's own default would want it.

# NOTE: there is deliberately no `fit_family` key.
#
# The fit family is a property of how a particular bank's parameters were estimated,
# not a style-wide setting, so it lives in each bank's manifest.json and is
# authoritative from there. The toggle exists at vendoring time
# (`vendor_bank.py --fit-family {2pl,3pl}` selects the upstream calibration directory).
# At run time a supplied family that disagrees with the manifest raises.
