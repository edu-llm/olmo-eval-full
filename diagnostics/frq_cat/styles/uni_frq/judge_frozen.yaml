# Frozen, calibrated judge SELECTION for uni_frq (identity only). The judge code is
# shared in diagnostics/frq_cat/common/judge.py and is never forked here; this file
# is parsed by judge.spec_from_config (top-level keys, not nested under `judge:`).
#
# The TutorEval unidim bank was calibrated with THIS judge, so keeping it fixed keeps
# ability estimates comparable across checkpoints. To grade with a different model,
# change `model_id` and point --judge-endpoint at a server that serves it. To grade
# with the frontier judge the team froze for TutorEval, use the sibling
# `judge_frontier.yaml`, which reproduces that selection and its caveats.
name: frozen-judge
model_id: Qwen/Qwen3.5-9B                              # FILL IN: model served at --judge-endpoint
revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
# The shared common/judge.py text prompt: the verdict word on the first line. Beware that
# the api_judge_pilot on frq/tutorbench uses this same name for a JSON contract; the two
# are not interchangeable, and `served-pass-fail` is a spelled-out alias for this one.
adapter: generic-binary
enable_thinking: false
language_model_only: true
temperature: 0.0
top_p: 1.0
max_tokens: 1024
metadata:
  # What the BANK was fitted under, in the calibration lab.
  calibration_prompt_version: judge-validation-v3
  calibration_normalization_version: judge-normalization-v3
  calibration_evidence_policy: criterion-evidence-gate-v1
  # What the shared client actually sends today (common/judge.py PROMPT_VERSION). These
  # differ: the runtime prompt has no evidence gate and no JSON contract. Until the shared
  # prompt is brought up to v3 on CheckpointFlows, theta from this judge is NOT on the
  # calibrated scale, and every report says so via metadata.judge_prompt.
  runtime_prompt_version: generic-binary/v1
  calibration: prompt-mismatch-uncalibrated
