# Throwaway generation probe: ask generate_batch what it returns on the real checkpoint.
#
# The counterpart of .edullm/run-native-cat.yaml, and it borrows that file's whole shape
# for the same reasons. Only the differences are argued here; everything the two share --
# why the image comes from OLMo-core rather than olmo-eval-full, why the code arrives by
# clone rather than by pip-installing a tarball, why --extra olmo_core would be a silent
# downgrade to the one ai2-olmo-core release that cannot read this checkpoint -- is
# argued there and not repeated.
#
# HOW TO SUBMIT THIS. From the OLMo-core clone, because the CLI validates --commit
# against the clone it is run in:
#
#   cd ../OLMo-core
#   edullm submit --experiment olmo-core-generation-probe --dataset none \
#     --workload olmo-core-check --compute gpu-1xl4 --hours 1 \
#     --commit 08df5aa0142465c80b4ea48e84faa46117275d61 \
#     --spec ../olmo-eval-full/.edullm/run-generation-probe.yaml
#
# WHAT THIS BUYS THAT SOURCE READING DOES NOT. OLMo-core 2.5.0 already answers, on paper,
# what generate_batch returns and what stops it: `generated` is seeded with `input_ids`
# and concatenated onto, so the prompt is in the return; and the stop test is
# `next_tokens.eq(eos)`, which never reads pad_token_id. What no amount of reading
# settles is whether THIS checkpoint -- trained with pad == eos == 0, which is why the
# scorer has to fabricate a pad id at all -- ever emits token 0 inside a short budget.
# That single fact decides whether a generative completer can rely on eos to end an item
# or has to treat every item as running to the full 1024-1280 token budget, which is the
# difference between a cheap generative CAT and an unaffordable one.
#
# THE PIN IS THE PROBE, NOT THE SPEC. The container clones olmo-eval-full and checks out
# one commit; --spec is read from the laptop and compiled into the submission, so this
# file does not need to be at that commit and cannot be. What must be at it is
# .edullm/generation_probe.py. Push before submitting -- an unpushed sha fails at
# `git checkout` inside the container, minutes into a paid run rather than here.
#
# NO --s3-out, WHICH IS THE POINT OF A THROWAWAY. The spike this is modelled on writes no
# artifact and neither does this: the product is the CloudWatch log, and a report file
# would imply something downstream reads it. Nothing does, and nothing imports the probe.
#
# --max-new-tokens 64 IS THE COST CONTROL AND IS ALSO SUFFICIENT. The banks ask for 1024
# (leaderboard_math, gpqa) and 1280 (ifeval). Sixty-four tokens cannot tell us what a
# finished answer looks like and is not meant to; it can tell us whether eos shows up at
# all, which is the question. Three prompts at 64 tokens is seconds of decode against
# minutes of checkpoint staging, so the run is priced by the 1.74 GB pull and not by
# generation.
#
# WHAT THE FIRST SUBMISSION OF THIS SPEC RETURNED, AND WHY THERE IS A SECOND. Run
# run_019fe2e6 got everything right except the answer: it staged the checkpoint, loaded it,
# built all three prompts, and then failed every generation with "'TorchAttentionBackend'
# doesn't support KV caching". GenerationConfig.use_cache defaults to True and the scorer
# names no attention backend, so olmo_core picks its default one, whose
# assert_supports_kv_cache raises as soon as prepare_inference_cache is called. MCQ scoring
# never met this because a forward-only pass prepares no cache. The eos question therefore
# came back unanswered, which is the one thing a completer cannot be written without.
#
# --attention-backend flash_2 IS THE FIX, AND THE SHAPE IS WHY IT IS THAT ONE. The flash
# backends implement KV caching where the torch one refuses it. An L4 is Ada, SM 8.9: FA3
# wants Hopper and FA4 Blackwell, so FA2 is the only flash backend this card can run. The
# probe resolves the name exactly as OlmoCoreProvider does rather than inventing a path.
#
# AND IT MIGHT NOT BE IN THE IMAGE, WHICH IS PLANNED FOR RATHER THAN HOPED ABOUT.
# flash-attn is a binary wheel and this spec installs ".[hf,s3]", which does not pull it.
# If it is absent the probe falls back to passing use_cache=False straight to
# generate_batch -- no reload, because generate_batch folds its kwargs onto the config --
# and decodes without a cache. That is slower per token and irrelevant at 64 tokens on a
# 135M model. Either way the run comes back with a decode and an eos answer, which is what
# makes this worth a second card rather than a third.
#
# --dtype bfloat16 IS NOW LIVE, AND THAT IS A CHANGE FROM THE FIRST RUN. This spec said the
# flag was inert to the loader, and it was: InferenceConfig carried no dtype, so
# from_checkpoint got none and built fp32. run_019fe2e6 measured it -- 546.2 MB of weights
# for a 135M model, four bytes a parameter, from a command line asking for bfloat16.
# InferenceConfig.dtype now reaches from_checkpoint, so this run should load at about half
# that, and the probe prints the figure beside the old one. The flag also still does its
# original job of letting the platform's bfloat16_not_in_the_hardware guard read the format
# out of argv and refuse a Turing allocation for free.
schema_version: 1
workload_profile: olmo-core-check
suggested_compute: gpu-1xl4
command: >-
  bash -lc 'if ! command -v git >/dev/null; then apt-get update -qq && apt-get install -y -qq --no-install-recommends git; fi
  && git clone --filter=blob:none https://github.com/edu-llm/olmo-eval-full.git /opt/olmo-eval-full
  && cd /opt/olmo-eval-full
  && git checkout ff1188ec354f53374dc310db982013c8465bee55
  && if [ -n "$(git status --porcelain --untracked-files=no)" ]; then echo "incomplete checkout: git exits 0 when a --filter=blob:none clone fails to fetch a blob, so these tracked paths are missing rather than modified" >&2; git status --porcelain --untracked-files=no >&2; exit 3; fi
  && python -m pip install --no-cache-dir ".[hf,s3]"
  && python .edullm/generation_probe.py
  --checkpoint s3://sbsandbox-intern-edullm-outputs/teams/input-core/runs/run_019fce1a-f393-70e3-ba0e-e2771c70f9c0/checkpoints/step305176/
  --max-new-tokens 64
  --attention-backend flash_2
  --dtype bfloat16'
