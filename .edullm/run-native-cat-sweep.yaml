# Every MCQ bank at once: one fan-out, one cell per benchmark, reporting Warm's estimate.
#
# The single-benchmark sibling is run-native-cat.yaml and everything in its header applies
# here unchanged -- why the submission goes against repository=OLMo-core, why the code
# arrives by clone rather than by wheel, why --checkpoint-prep none is the native path, and
# why --dtype bfloat16 sets the precision the native scorer builds the model at even though
# it converts nothing. Read that file first, and note in particular its warning that any
# native theta recorded before 2026-08-08 says bfloat16 and was produced in fp32. This one
# records only what is different, which is three things.
#
# HOW TO SUBMIT THIS. From the OLMo-core clone, as with the other spec:
#
#   cd ../OLMo-core
#   edullm submit --experiment native-olmo-core-cat-sweep --dataset none \
#     --workload olmo-core-check --compute gpu-1xl4 \
#     --spec ../olmo-eval-full/.edullm/run-native-cat-sweep.yaml
#
# The fan-out is declared below rather than passed as --fanout-size, so the sweep's shape
# lives beside the loop it drives and a submission cannot ask for a cell count the command
# has no benchmark for.
#
# ---------------------------------------------------------------------------------------
# 1. FIVE MCQ BENCHMARKS. THIS IS THE ONE THING TO READ BEFORE APPROVING.
#
# The array below is five cells: arc_challenge, hellaswag, musr, bbh, gpqa. Every one is
# MCQ, scored by continuation log-likelihood, and reads this checkpoint format natively.
#
# THIS HEADER WAS REWRITTEN 2026-08-08 AND SAID SOMETHING DIFFERENT FROM ITS OWN BODY.
# It claimed four benchmarks and not seven, listed `ifeval` among the ready banks, called
# `gpqa` generative and therefore excluded, and justified all of it with an objection that
# has since been measured and withdrawn -- while the `fanout` below it was already five
# cells with `gpqa` in the array. A lead reading it was told the opposite of what would
# run. Three things changed underneath it and none updated it:
#
#   * `gpqa` was re-vendored as MCQ, which is why it is a cell here.
#   * `ifeval` is now blocked outright. A model reciting its prompt passes 129 of its 511
#     items, so it reports a high, tight theta that means nothing. See its `blocked`
#     reason in datasets.py and RESULT_CAVEATS.md. It is not a candidate for any sweep
#     until the echo-baseline guard exists.
#   * The pad/eos objection is gone. `GenerationConfig.validate` rejects only pad == eos,
#     and fabricating the *pad* leaves the real EOS at 0 -- which is what the MCQ scorer
#     already does. Probe run_019fe316-0e47 loaded this checkpoint that way and decoded 64
#     tokens on each of three prompts.
#
# So `generative.GENERATIVE_BACKENDS` now registers `olmo_core` alongside `hf`, and
# `leaderboard_math` can be graded natively with no conversion step. It is absent here
# because this spec is the MCQ sweep, not because it cannot run; see
# Plan/flows/uni_mcq/GENERATIVE_RUN.md for the generative submission.
#
# Conversion via `--checkpoint-prep auto --checkpoint-kind hf` remains available and is
# now the fallback rather than the route: it costs a converted copy beside the 1.74 GB
# original, needs Hub egress for the tokenizer, and `save_hf_model` on a config using
# `sequence_mixer` is unverified. The native path needs none of that.
#
# ---------------------------------------------------------------------------------------
# 2. RUNTIME. THE BOUND IS PER CELL, WHICH IS WHY A FAN-OUT AND NOT A LOOP.
#
# `olmo-core-check` fixes 1h and refuses any --hours above it
# (`runtime_above_the_workload_bound`). That bound applies to each cell of an array job
# independently, so five benchmarks in one container would share one hour while five cells
# get an hour each. Cost is the same either way -- five cells at $0.8048/h is the same
# $4.02 ceiling as one container for five hours would have been, except the latter is not
# submittable.
#
# WORTH KNOWING BEFORE CHOOSING A FAN-OUT AT ALL: approval class is decided in
# `classify_request`, not by a cost threshold. A fan-out never auto-approves whatever it
# costs, while a single cell routes to `automatic`. This sweep classified `routine` and
# waited about 16 minutes for a lead. Five single-cell submissions would have cost the same
# $4.02 and waited for nobody. A fan-out is the right shape when the cells are one
# experiment; it is the wrong shape when they are five independent runs that happen to be
# convenient to launch together.
#
# None of these five is close to the bound. They are scored by continuation
# log-likelihood, which is one forward pass per answer choice, and the session stops at
# min_items (8, or 24 for bbh) once SE reaches 0.3 -- run_019fe277 administered 8 items on
# arc_challenge. Platform history for this workload on this machine is a median of 8m over
# three runs, between 2m and 21m, and most of that is the pip install and the 1.74 GB pull
# rather than the CAT.
#
# ---------------------------------------------------------------------------------------
# 3. THE REPORTED ESTIMATOR IS batch_eap+mwle, AND THIS IS THE DELIBERATE CHOICE HERE.
#
# EAP's standard-normal prior compresses every ability toward zero, hardest at the tails.
# MWLE drops it and penalises 1/2 ln I(theta) instead. Both thetas land in every report
# under `theta_batch` and `theta_mwle` whichever is asked for, so this decides which number
# `ability.theta` carries and nothing else -- and in particular it does not change which
# items are administered, because selection conditions on the sequential estimate in both
# modes. To make this sweep directly comparable with run_019fe277's published theta rather
# than with its `theta_batch` field, change the one word below to `batch_eap`.
#
# The pinned sha carries that flag. A commit without it fails at argparse, immediately and
# cheaply, which is the failure mode to prefer over one that ignores it.
#
# ONE THING THIS SWEEP TAUGHT, FOR WHOEVER READS ITS REPORTS. Under batch_eap+mwle the
# `ability.standard_error` in the report is `se_mwle`, an asymptotic 1/sqrt(I(theta)) over
# the administered items -- NOT the posterior SD the stopping rule used, which is
# `se_online`. The two are not on one scale, so reading the reported SE against the 0.3
# threshold compares quantities that were never compared during the run. On run_019fe33f
# this inverted the apparent precision ordering: musr looks anomalously sharp at 0.060 on
# se_mwle and is an unremarkable 0.172 on se_online, where bbh is tightest at 0.108 simply
# for having administered 24 items. The report says so itself in
# `metadata.se_mwle_definition`; see RESULT_CAVEATS.md.
#
# ---------------------------------------------------------------------------------------
# 4. THE PINNED SHA IS STALE. REPIN BEFORE SUBMITTING.
#
# `git checkout 49d93da4...` below is now several commits behind, and the gap is not
# cosmetic: it predates the per-item generation budgets, the runtime end-of-text
# resolution, the exemplar ladder, the ifeval block and the native generative backend. The
# container clones from GitHub at whatever this names, so submitting as-is evaluates a
# harness nobody has and returns a well-formed report with a plausible theta. That is a
# wrong answer rather than a failure, and nothing downstream catches it.
#
# Commit, push, then repin this line. Note that `edullm check`'s `uncommitted_changes`
# refusal reads the OLMo-core tree rather than this one, so a clean check says nothing
# about whether this repository's work is pushed.
schema_version: 1
workload_profile: olmo-core-check
suggested_compute: gpu-1xl4
fanout:
  size: 5
  index_parameter: benchmark
command: >-
  bash -lc 'BENCHMARKS=(arc_challenge hellaswag musr bbh gpqa)
  ; CELL="${AWS_BATCH_JOB_ARRAY_INDEX:-0}"
  ; BENCH="${BENCHMARKS[$CELL]:-}"
  ; if [ -z "$BENCH" ]; then echo "cell $CELL has no benchmark; fanout.size must equal ${#BENCHMARKS[@]}" >&2; exit 2; fi
  ; echo "cell $CELL -> $BENCH"
  ; if ! command -v git >/dev/null; then apt-get update -qq && apt-get install -y -qq --no-install-recommends git; fi
  && git clone --filter=blob:none https://github.com/edu-llm/olmo-eval-full.git /opt/olmo-eval-full
  && cd /opt/olmo-eval-full
  && git checkout 49d93da4534169b57d4ff6252fdd954323ab6e9d
  && if [ -n "$(git status --porcelain --untracked-files=no)" ]; then echo "incomplete checkout: git exits 0 when a --filter=blob:none clone fails to fetch a blob, so these tracked paths are missing rather than modified" >&2; git status --porcelain --untracked-files=no >&2; exit 3; fi
  && python -m pip install --no-cache-dir ".[hf,s3]"
  && python -m diagnostics.mcq_cat.runner
  --cat-style uni_mcq
  --checkpoint s3://sbsandbox-intern-edullm-outputs/teams/input-core/runs/run_019fce1a-f393-70e3-ba0e-e2771c70f9c0/checkpoints/step305176/
  --benchmark "$BENCH"
  --ability-estimator batch_eap+mwle
  --checkpoint-prep none
  --checkpoint-kind olmo_core
  --dtype bfloat16
  --s3-out "$EDULLM_OUTPUT_PREFIX"'
