# eduLLM job: an MCQ CAT session read straight off an OLMo-core checkpoint, unconverted.
#
# Originally written by edullm check, from config/workload-catalog.yaml.
# Everything here is a property of the code and travels with it in git.
# The machine, the corpus and the experiment are supplied at submit time,
# because one commit run by two people belongs to two teams.
#
# Workload profiles registered for olmo-eval-full: olmo-eval-check, olmo-eval-sweep.
# edullm check prices this and lists every refusal, without dispatching anything.
#
# olmo-eval-sweep rather than olmo-eval-check, because this loads a real model onto a
# card. The catalog describes olmo-eval-check as the mock-provider path that proves the
# harness loads without a model, and olmo-eval-sweep as the scoring entry where a GPU
# first helps. Two hours is the ceiling rather than an estimate; a 13-40 item CAT over a
# 135M model should take minutes, and the ceiling is what gets priced.
#
# gpu-1xl4 because capacity.yaml records it as placing `reliably` and an L4 has bfloat16
# in hardware. Three of the other reliable shapes are T4, which is Turing and has no
# bfloat16 at all -- a run on one would be priced, released, admitted, given a machine,
# and then refuse the first kernel that needs the format. Overriding --compute onto one
# is now refused rather than merely inadvisable; the bfloat16 note below says by what.
#
# EVERYTHING IS BAKED INTO command:. `edullm submit` cannot inject environment variables,
# so the checkpoint under test, the benchmark and every flag are written here rather than
# passed in, and pointing this at a different checkpoint means editing this file,
# committing, and pushing to edullm/** so the image rebuilds. A submission against an
# edited-but-unpushed working tree evaluates the previous checkpoint and produces a
# well-formed cat_report.json with a plausible theta for it.
#
# The checkpoint reads from the outputs bucket, not edullm-checkpoints: the GPU workload
# role is scoped to teams/<team>/runs/*, so a checkpoint staged under that space is
# readable by a run and edullm-checkpoints is not. Results go to $EDULLM_OUTPUT_PREFIX,
# this run's own prefix, injected by the platform and the only place the role may write.
#
# ============================================================================
# THE NATIVE PATH: --checkpoint-prep none --checkpoint-kind olmo_core
# ============================================================================
#
# Two independent seams, and this line is one cell of the four they make. `--checkpoint-
# prep` decides what happens to the staged directory before anything loads it, and
# `--checkpoint-kind` decides which backend loads whatever comes out. `none` hands the
# sharded DCP directory over untouched; `olmo_core` is the backend that reads that layout
# through ai2-olmo-core's TransformerConfig.from_dict rather than through transformers.
#
# BOTH FLAGS, OR NEITHER IS DOING ANYTHING. `--checkpoint-kind olmo_core` on its own
# leaves preparation at `auto`, which sniffs the directory, converts it to HuggingFace,
# and hands the native reader an HF checkpoint it cannot read. `--checkpoint-prep none`
# on its own leaves the HF backend pointed at raw shards. The pairing is the
# configuration; either half alone is a misconfiguration that looks like a typo.
#
# WHAT THIS BUYS OVER THE CONVERSION PATH. The conversion unsharded 1.74 GB of DCP into a
# second full copy of the weights inside the same tmpdir, ran an upstream converter that
# needed an in-process patch to accept this architecture at all, and did it once per run
# to answer a session that administers 13-40 items. None of that happens here. What it
# costs is that the scorer is new code -- see the honest-risk note at the bottom.
#
# THE CHECKPOINT IS STILL FULLY DOWNLOADED. `prep none` skips the conversion, not the
# fetch: resolve_checkpoint still pulls all 140 objects and 1.74 GB under the prefix,
# because the loader reads the shards. This is not a smaller download, only a smaller
# peak disk and one fewer moving part.
#
# ============================================================================
# NO uv sync HERE, AND THAT IS A REVERSAL
# ============================================================================
#
# This command used to open with `uv sync --frozen ... --extra olmo_core`, and the comment
# beside it argued the extras had to be preserved or the sync would uninstall what the
# image was built to carry. That argument is now backwards, and keeping the line would
# undo this whole change.
#
# .edullm/Dockerfile installs the fork of ai2-olmo-core over the lockfile's resolution
# with `uv pip install --no-deps`, so the image carries 2.5.0-from-git where uv.lock names
# 2.4.0-from-PyPI. `uv sync --frozen` makes the environment match the lock exactly. It
# would therefore see a version it did not put there and replace the baked fork with the
# PyPI wheel that cannot parse this checkpoint's config -- silently, in the first second
# of a billed GPU run, and the failure four minutes later would read as a checkpoint
# problem rather than as this line.
#
# There is also nothing left for it to do. The image already contains every extra the
# sync would have named, plus the project itself (`uv pip install --no-deps .`), and the
# Dockerfile asserts at build time that the schema this checkpoint needs actually parses.
# A sync here is a resolution nothing reviewed, run inside a job that is meant to be
# reproducible, whose only possible effects are no-op or damage.
#
# UV_NO_SYNC=1 STAYS, AND IT IS A GUARD RATHER THAN A FIX. It does nothing today: this
# command invokes `python` directly, so no implicit sync is reachable from what is written
# below. It stays because `uv run` is the obvious way anyone would add a step to this line
# later, `uv run` syncs before it runs, and that sync is the exact failure described in the
# paragraph above. One environment variable is a cheap standing refusal for a mistake whose
# symptom is a plausible-looking traceback about a config schema.
#
# NO OLMO_CORE_HF_MAX_POSITION_EMBEDDINGS, BECAUSE NOTHING HERE EMITS AN HF CONFIG. That
# variable is read by diagnostics/mcq_cat/common/hf_config_patch.py, which is applied
# in-process at the top of convert_olmo_core_to_hf to get past upstream's get_hf_config
# refusing the plain pre-norm TransformerBlock these checkpoints use. Under `prep none`
# the converter never runs, so both the patch and the variable are dead. Carrying it
# anyway would be a line implying a conversion that does not happen.
#
# THE HUGGINGFACE HUB IS STILL NEEDED, AND THAT SURVIVED THE CHANGE. The checkpoint
# carries no tokenizer files, only the identifier HuggingFaceTB/SmolLM2-135M in its
# config's dataset.tokenizer block. The native scorer resolves that through AutoTokenizer
# exactly as the converter did, so a node that can reach S3 and not huggingface.co still
# fails -- now at load rather than at the end of a conversion.
#
# --dtype bfloat16 IS KEPT, AND ON THIS PATH IT IS AN ADMISSION DECLARATION RATHER THAN A
# CONVERSION KNOB. Nothing is converted, so the flag writes no weights and the runner logs
# a warning saying so; a reader of the job log should expect that line and not read it as
# a fault. It is kept because the platform's bfloat16_not_in_the_hardware guard reads the
# text of command: and nothing else, and the hardware requirement did not go away with the
# conversion -- the weights this checkpoint holds are bfloat16 and the native loader runs
# them on the card in that format. Dropping the flag drops all three Turing refusals
# (measured 2026-08-08: gpu-1xt4, gpu-4xt4 and gpu-8xt4 return
# bfloat16_not_in_the_hardware with it, and none of them without), so a T4 override would
# price, pass, be admitted, be given a machine, and die on the first kernel wanting the
# format.
#
# That is a flag being used for its side effect on admission rather than for what it
# names, and it is worth saying plainly rather than leaving as a coincidence. The clean
# version is a precision flag that the native path also honours; until that exists, this
# is the only text the guard can read, and a redundant warning line is cheaper than an
# unadmissible card.
#
# ============================================================================
# WHAT IS NOT PROVEN
# ============================================================================
#
# The native scorer has never executed against a real checkpoint. Its arithmetic is
# pinned against the HuggingFace scorer's on synthetic logits and its wiring is pinned
# against olmo-eval's real checkpoint helpers, but what OLMo-core's model_forward returns
# for a batch of one, what HuggingFaceTB/SmolLM2-135M's tokenizer prepends by default, and
# whether bfloat16 log_softmax without an intermediate .float() agrees with the provider's
# cast are all open. Two of the three fail loudly if they are wrong -- there is a
# permanent shape assertion on the forward output, and the tokenizer's defaults are
# measured at load and written into the report's run.tokenization block. This run is the
# test.
schema_version: 1
workload_profile: olmo-eval-sweep
suggested_compute: gpu-1xl4
command: >-
  bash -lc 'export UV_NO_SYNC=1
  && python -m diagnostics.mcq_cat.runner
  --cat-style uni_mcq
  --checkpoint s3://sbsandbox-intern-edullm-outputs/teams/input-core/runs/run_019fce1a-f393-70e3-ba0e-e2771c70f9c0/checkpoints/step305176/
  --benchmark arc_challenge
  --checkpoint-prep none
  --checkpoint-kind olmo_core
  --dtype bfloat16
  --s3-out "$EDULLM_OUTPUT_PREFIX"'
