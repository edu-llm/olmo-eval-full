# eduLLM job: steering-vector trustworthiness test over an S3 model checkpoint.
#
# Everything here is a property of the code and travels with it in git; only the
# machine, the corpus (--dataset none, this reads a checkpoint not a corpus) and
# the experiment are supplied at submit time. `edullm submit` cannot inject env
# vars, so the checkpoint under test and the sweep are baked into the command.
#
# The checkpoint reads from the outputs bucket, not edullm-checkpoints: the GPU
# workload role is scoped to teams/<team>/runs/*, so a checkpoint staged under
# that space is readable by a run and edullm-checkpoints is not. Results write to
# $EDULLM_OUTPUT_PREFIX (this run's own prefix, injected by the platform), the
# only place the workload role may write. To test a different checkpoint, stage
# it under teams/<team>/runs/ and edit the path below, then re-push.
# (SteeringVectors/run.env.example drives local --dry-run only.) See
# SteeringVectors/README.md for the image decision this job depends on.
#
# olmo_core is pinned to the edu-llm/OLMo-core fork (not PyPI ai2-olmo-core
# 2.4.0): this checkpoint's config uses a newer schema (sequence_mixer /
# RoPEConfig.partial_rotary_factor) the fork wrote and 2.4.0 cannot build. The
# --extra olmo_core sync brings the full dep set (torchao, transformers), then
# the git install swaps in the fork commit current when the checkpoint was
# written (2026-07-26, just before the 07-27 checkpoint).
#
# The image the platform builds for olmo-eval-full carries transformers but not
# torch (INSTALL_TORCH_AND_VLLM defaults to 0 in .edullm/Dockerfile). This
# pipeline needs torch, so the command first materializes it from the checked-in
# lockfile's vllm extra -- the run-time alternative the Dockerfile documents --
# rather than flipping the shared image default for every olmo-eval run. Point a
# submission at the torch-enabled image instead and drop the `uv sync` prefix if
# that default is ever flipped on this branch.
schema_version: 1
workload_profile: olmo-eval-sweep
suggested_compute: gpu-1xl40s
command: >-
  bash -lc 'uv sync --frozen --no-default-groups
  --extra beaker --extra hf --extra s3 --extra clients --extra vllm --extra olmo_core
  && uv pip install "ai2-olmo-core @ git+https://github.com/edu-llm/OLMo-core@7bd6d57120d78e331d29c887f34ed7a4584ce3b5"
  && python SteeringVectors/run_steering_eval.py
  s3://sbsandbox-intern-edullm-outputs/teams/eval-inference/runs/steering-staged-refhq-step1315/checkpoint/
  --steering-dataset stereoset
  --eval-dataset stereoset
  --layers 8
  --alphas -1
  --max-statements 200
  --eval-limit 100
  --results-s3 "$EDULLM_OUTPUT_PREFIX"
  --run-name steering-eval-refhq-step1315
  --device cuda:0'
