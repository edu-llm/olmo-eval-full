# The three locally fitted banks, on the checkpoint they were never calibrated against.
#
# run-native-cat.yaml's header applies here unchanged -- why the submission goes against
# repository=OLMo-core, why the code arrives by clone rather than by wheel, why
# --checkpoint-prep none is the native path, and why --dtype bfloat16 sets the precision
# the native scorer builds at even though it converts nothing. Read it first. This file
# records only what is different, which is three things.
#
# HOW TO SUBMIT. From the OLMo-core clone, and NAME THE COMMIT:
#
#   cd ../OLMo-core
#   edullm submit --experiment new-banks-cat --dataset none \
#     --workload olmo-core-check --compute gpu-1xl4 \
#     --commit 08df5aa0142465c80b4ea48e84faa46117275d61 \
#     --spec ../olmo-eval-full/.edullm/run-new-banks-cat.yaml
#
# `--commit` is not optional here, and leaving it off is what the first attempt at this
# run did. Without it the submission resolves whatever OLMo-core commit is checked out,
# and compile refuses any commit that published no image: "build commit <sha> before
# submitting it". Building the working branch is not the fix -- `edullm/p3-math-split`
# fails the build's own lint gate on 33 pre-existing syntax errors under
# `research/p3_corpus/scripts/`, which have nothing to do with this run, and several other
# working branches fail the same way.
#
# So name a `main` commit, which the build workflow covers deliberately for this reason.
# `08df5aa0` is chosen over the newer `4336ccc0` because it is the OLMo-core 2.5.0 the
# native decode was proven against, including probe run_019fe316-0e47. These banks have
# never run on a GPU, so this run changes the banks and holds the environment fixed; a
# failure under a base image nobody has used would not say which of the two caused it.
#
# ---------------------------------------------------------------------------------------
# 1. THIS IS THE FIRST GPU RUN OF THESE THREE BANKS. THAT IS THE POINT OF IT.
#
# pedagogy, piqa and socialiqa were fit from the 2026-08-01 sweep and vendored at
# fbfb11e9. Everything establishing them was offline: the joins measured item by item
# against the sweep's frozen cache, the parameters reproducing the published
# 318 / 831 / 969 kept-item counts, and the suite passing. Nothing had run on a GPU.
#
# IT HAS NOW, AND IT PASSED. run_019fe82c-708b-703f-b4ab-58f699b728c9, 2026-08-09:
#
#   pedagogy   theta -0.476  se_mwle 0.321 (se_online 0.308)  40 items  max_items_reached
#   piqa       theta -1.458  se_mwle 0.168 (se_online 0.176)   8 items  precision_reached
#   socialiqa  theta -0.713  se_mwle 0.319 (se_online 0.307)  40 items  max_items_reached
#
# Nothing ungradable on any cell, bank sizes 379 / 896 / 992 as vendored, and every report
# recording prompt_style question_answer with score_normalization
# continuation_logprob_per_token -- so the run-time convention matched the calibration
# rather than merely claiming to.
#
# The stop reasons are the result worth keeping. piqa converged at the 8-item floor while
# the other two ran to the 40-item cap without reaching SE 0.3, which is the ordering their
# calibration predicts: piqa is the bank that separates models (r = 0.937), and the other
# two barely separate their own calibration population. A session can administer everything
# a weak bank has and still not sharpen. That is the bank behaving as characterised.
#
# A GPU RUN CANNOT VERIFY THE JOIN, AND AN EARLIER VERSION OF THIS HEADER SAID IT COULD.
# It asked a reader to check `metadata.overlap` was total, on the reasoning that anything
# less meant the container had enumerated a different split than the vendoring laptop.
# Three things wrong with that: no report carries an `overlap` key, the container
# enumerates no split at all, and so the check it prescribed cannot be performed.
#
# A vendored bank ships its items. `download_benchmark` resolves `items.jsonl` off the
# local filesystem and downloads nothing, which is the same property that lets pedagogy run
# without a HuggingFace token despite being gated. So the join is settled before a
# submission exists and cannot be re-tested by one.
#
# What the report does carry is `bank_provenance.dropped`, with `not_in_bridge` and
# `not_in_task` at 0 and `bridge_rows` equal to `upstream_bank_rows`. Read those for what
# they are: vendor-time facts copied verbatim into the report, carrying the
# `generated_at` of the vendoring run rather than of this one. They confirm the bank was
# built consistently, not that it is aimed at the right questions. The evidence for that is
# offline and stronger -- every item compared against the sweep's frozen cache, then each
# task enumerated against that same cache position by position.
#
# pedagogy's report carries a `bank_caveat` the other two do not. Its predicted accuracy
# has a mean absolute error of 0.101 against a 0.087 span of real accuracies, so that
# figure is not readable and its theta is; the caveat says so in every report and is not a
# reason to distrust the run.
#
# ---------------------------------------------------------------------------------------
# 2. THIS CHECKPOINT IS BELOW THE CALIBRATED BAND, ON PURPOSE.
#
# The banks were calibrated on 0.5B-7B models and the evaluation targets are 1B-7B.
# Preston's is a 135M-parameter checkpoint, so it sits below the population every one of
# these difficulties was estimated against. It is here because it is the checkpoint whose
# native path is proven, not because its theta means anything.
#
# Read this run for whether the pipeline works, not for how good the model is. piqa was
# the one to watch: a 2PL has no guessing parameter, and the single sub-1B model in the
# held-out diagnostics was handed a predicted accuracy of 0.371 on a bank whose chance
# floor is 0.50. This checkpoint is sub-1B, so the same impossible value was the expected
# outcome.
#
# It did not happen. run_019fe82c predicted 0.580 for piqa, above the floor. One
# checkpoint is not a refutation of a documented failure mode, and the reason to keep
# stating the supported ability range is unchanged; but the range is a guard against
# something that has not yet been observed here rather than a description of what this
# checkpoint does.
#
# ---------------------------------------------------------------------------------------
# 3. A FAN-OUT OF THREE, WHICH COSTS A LEAD'S APPROVAL AND IS STILL THE RIGHT SHAPE.
#
# `classify_request` routes any fan-out away from `automatic` whatever it costs, while a
# single cell auto-approves; the sweep before this one waited about 16 minutes. Three
# single-cell submissions would cost the same $2.41 ceiling and wait for nobody.
#
# It is a fan-out anyway because these three cells are one experiment -- the first
# evidence that a set of banks vendored together runs at all -- and the reports are meant
# to be read against each other. That is the criterion run-native-cat-sweep.yaml's header
# sets out, and this is the case it describes rather than the one it warns about.
#
# `olmo-core-check` fixes 1h per cell and refuses more. None of these is close: MCQ items
# are one forward pass per answer choice and the session stops at min_items (8) once SE
# reaches 0.3, so most of the wall clock is the pip install and the 1.74 GB pull.
schema_version: 1
workload_profile: olmo-core-check
suggested_compute: gpu-1xl4
fanout:
  size: 3
  index_parameter: benchmark
command: >-
  bash -lc 'BENCHMARKS=(pedagogy piqa socialiqa)
  ; CELL="${AWS_BATCH_JOB_ARRAY_INDEX:-0}"
  ; BENCH="${BENCHMARKS[$CELL]:-}"
  ; if [ -z "$BENCH" ]; then echo "cell $CELL has no benchmark; fanout.size must equal ${#BENCHMARKS[@]}" >&2; exit 2; fi
  ; echo "cell $CELL -> $BENCH"
  ; if ! command -v git >/dev/null; then apt-get update -qq && apt-get install -y -qq --no-install-recommends git; fi
  && git clone --filter=blob:none https://github.com/edu-llm/olmo-eval-full.git /opt/olmo-eval-full
  && cd /opt/olmo-eval-full
  && git checkout fbfb11e9a053d2161df374d2a00edf499b51dff1
  && python -m pip install --no-cache-dir ".[hf,s3]"
  && python -m diagnostics.mcq_cat.runner
  --cat-style uni_mcq
  --checkpoint s3://sbsandbox-intern-edullm-outputs/teams/input-core/runs/run_019fce1a-f393-70e3-ba0e-e2771c70f9c0/checkpoints/step305176/
  --benchmark "$BENCH"
  --ability-estimator batch_eap+mwle
  --checkpoint-prep none
  --checkpoint-kind olmo_core
  --dtype bfloat16
  --s3-out "$EDULLM_OUTPUT_PREFIX"'
