# FRQ CAT on a checkpoint: the tutor answers TutorEval scenarios, a judge grades each
# rubric criterion, and an adaptive 2PL loop reports ability with a standard error.
#
# HOW TO SUBMIT.
#
#   edullm submit --experiment frq-cat-uni --dataset none \
#     --workload olmo-eval-sweep --compute gpu-1xl4 --hours 2 \
#     --spec .edullm/run-frq-cat.yaml
#
# olmo-eval-sweep, not olmo-core-check. The catalog registers only olmo-eval-check and
# olmo-eval-sweep for olmo-eval-full (see run.yaml); olmo-core-check belongs to specs
# submitted from the OLMo-core clone. olmo-eval-check is the mock-provider path that
# proves the harness loads without a model, so a run that puts a 7B on a card is the
# sweep. Two hours is that profile's ceiling, and the timeouts below are sized to fit
# inside it with room for the clone and the install.
#
# THE IMAGE CARRIES NO TORCH, AND FOR THIS FLOW THAT IS THE POINT. .edullm/Dockerfile on
# this branch syncs `--extra beaker --extra hf --extra s3 --extra clients` and nothing
# else, so the published olmo-eval-full image has neither torch nor vLLM. That is why the
# install below is `.[hf,s3,vllm]` and why it costs about 4.54 GiB inside the paid run.
# Taking OLMo-core's image instead to skip that download trades a known cost for an
# unknown one: it bakes CUDA torch 2.10 with ai2-olmo-core, vLLM pins its own torch, and
# installing one over the other moves torch underneath a stack built against it. A base
# with no torch has nothing for vLLM to disagree with.
#
# PUSHING THIS BRANCH BUILDS AN IMAGE, AND THAT IS WHAT MAKES THE COMMIT SUBMITTABLE.
# edullm/** is the only prefix that fires edullm-platform-build.yml (~4 minutes, one
# immutable ECR tag per push). tickets/README.md argues against that prefix, correctly,
# for runs that take their image from OLMo-core and never pull this one. An olmo-eval-*
# profile does pull it, so here the build is the cost of being submittable rather than
# waste. The code still arrives by clone at the pin below, not from the image, so the pin
# and not the image tag is what says which harness ran.
#
# WHY THIS SPEC RUNS A SHELL SCRIPT AND THE MCQ SPECS RUN THE RUNNER DIRECTLY. This is the
# one structural difference between the two flows and everything else follows from it. MCQ
# scores choice log-likelihoods in-process: the checkpoint is loaded inside the eval
# process and `python -m diagnostics.mcq_cat.runner` is the whole command. FRQ cannot do
# that. It needs free-response text, so the checkpoint has to be *served* over an
# OpenAI-compatible endpoint before any scoring happens, and something has to start that
# server, wait for it to answer, and tear it down. That is
# diagnostics/frq_cat/styles/uni_frq/aws/serve_and_run.sh, which then runs the pipeline.
#
# WHY ".[hf,s3,vllm]" AND NOT ".[hf,s3]". Same reason. The MCQ specs deliberately leave
# torch and vLLM out because they do not serve anything. Omitting the vllm extra here would
# install cleanly and then die at the first `vllm serve`, inside a paid run.
#
# WHY curl IS INSTALLED. serve_and_run.sh polls /v1/models with curl to decide the tutor is
# up, and refuses to start without it. The image ships git and ca-certificates but not curl,
# so the bootstrap below adds both.
#
# A CLONE RATHER THAN A WHEEL, INHERITED FROM THE MCQ SPECS AND TRUE FOR THE SAME REASON.
# diagnostics/ sits at the repository root and is not shipped in the wheel, and this style
# carries an 8.7 MB bank as data that resolve-by-__file__ has to find on disk.
#
# THE SHA BELOW IS A PLACEHOLDER AND MUST BE REPINNED BEFORE THE FIRST SUBMIT. A spec cannot
# pin the commit that contains it, so the pin necessarily names an earlier commit; what
# matters is that the sha carries the code the run executes. Push before submitting: an
# unpushed sha fails at `git checkout` inside the container, minutes into a paid run rather
# than here.
#
# WHY A `git status` CHECK SITS BETWEEN THE CHECKOUT AND THE INSTALL. An unpushed sha fails
# loudly, which is the easy case. A *partial* clone fails quietly: `--filter=blob:none`
# defers blobs to checkout time, and when one of those lazy fetches fails, `git checkout`
# prints `error: unable to read sha1 file`, leaves the path absent, and still exits 0. The
# `&&` chain would then install and grade against a tree with files missing, and what comes
# back is a plausible report rather than a crash. This flow is more exposed to that than the
# MCQ ones: the bank is 8.7 MB of jsonl resolved by __file__ at run time, so a bank blob that
# never arrived reads as a smaller bank rather than as an error. A fresh checkout of a clean
# commit has nothing to report, so any tracked path `git status` names is a path the clone
# did not deliver. `-uno` keeps it from tripping on untracked scratch.
#
# THE JUDGE. Three configurations, and only one of them runs on a single 24 GB card:
#
#   JUDGE_MODE=api with JUDGE_ENDPOINT  (this spec)  Only the tutor occupies the GPU. The
#     judge is reached over HTTP at a Qwen3.5-9B endpoint you already have running. Nothing
#     secret is needed, which matters because no spec in this repository injects a secret
#     and there is no key-injection mechanism to rely on.
#   JUDGE_MODE=api against a hosted frontier model  Needs JUDGE_API_KEY_ENV plus a way to
#     get that key into the container. That mechanism does not exist today.
#   JUDGE_MODE=local  Serves the judge on a second port of the same box. The 9B judge alone
#     is ~18 GB in bf16, so it cannot share a 24 GB card with a 7B tutor. Use a second
#     instance instead; the team's allowlist tops out at g6.xlarge.
#
# CONTEXT WINDOW: 4096 IS THE TUTOR'S LIMIT, NOT A SETTING. OLMo-2-7B was trained at
# max_position_embeddings=4096 and vLLM will not serve it wider. TutorEval prompts reach
# ~9.7k tokens, so roughly 16% of scenarios cannot be served by this tutor at all. They are
# skipped, recorded in skipped.jsonl, and counted in the report's `ungradable` block, which
# raises `alert` past 20%. Those scenarios are harder than average (mean difficulty 3.8 vs
# 2.0), so this tutor is scored on an easier subset than TutorEval as a whole. Scoring the
# full bank needs a long-context tutor, not a different flag.
#
# WHAT LANDS IN $EDULLM_OUTPUT_PREFIX. Flat, matching the MCQ flow: manifest.json,
# responses.jsonl, judgments.jsonl, trajectory.jsonl, skipped.jsonl, abstentions.jsonl,
# cat_report.json, and _SUCCESS last. A prefix without _SUCCESS is an incomplete run, not a
# bad model. (Pass --namespace-run only for a self-managed bucket several runs share.)
schema_version: 1
workload_profile: olmo-eval-sweep
suggested_compute: gpu-1xl4
command: >-
  bash -lc 'if ! command -v git >/dev/null || ! command -v curl >/dev/null; then apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl; fi
  && git clone --filter=blob:none https://github.com/edu-llm/olmo-eval-full.git /opt/olmo-eval-full
  && cd /opt/olmo-eval-full
  && git checkout REPLACE_WITH_A_PUSHED_SHA_ON_edullm_uni-frq-style
  && if [ -n "$(git status --porcelain --untracked-files=no)" ]; then echo "incomplete checkout: git exits 0 when a --filter=blob:none clone fails to fetch a blob, so these tracked paths are missing rather than modified" >&2; git status --porcelain --untracked-files=no >&2; exit 3; fi
  && python -m pip install --no-cache-dir ".[hf,s3,vllm]"
  && CHECKPOINT=allenai/OLMo-2-1124-7B-Instruct
  OUT="$EDULLM_OUTPUT_PREFIX"
  JUDGE_MODE=api
  JUDGE_ENDPOINT=REPLACE_WITH_A_REACHABLE_JUDGE_V1_URL
  JUDGE_CONFIG=diagnostics/frq_cat/styles/uni_frq/judge_frozen.yaml
  TUTOR_MAX_MODEL_LEN=4096
  MAX_ITEMS=40
  SE_THRESHOLD=0.3
  READY_TIMEOUT=1200
  PIPELINE_TIMEOUT=4800
  bash diagnostics/frq_cat/styles/uni_frq/aws/serve_and_run.sh'
