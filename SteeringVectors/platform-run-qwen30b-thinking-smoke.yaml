# eduLLM GPU smoke: steering vector from Qwen3-30B-A3B-Thinking (HF checkpoint).
#
# Prerequisites: stage checkpoint under teams/eval-inference/runs/ (see
# stage_checkpoints.sh or platform-run-stage-qwen-posttraining.yaml).
# Manifest: checkpoints_qwen30b-thinking.json
#
# gpu-4xl40s (4× L40S, 192 GB): smallest registered shape that fits ~60 GB bf16
# weights. gpu-1xh100 (80 GB single GPU) is not provisioned on the platform.
#
# Submit:
#   edullm submit --dataset none --compute gpu-4xl40s --experiment qwen30b-steering-smoke \
#     --spec SteeringVectors/platform-run-qwen30b-thinking-smoke.yaml
schema_version: 1
workload_profile: olmo-eval-sweep
suggested_compute: gpu-4xl40s
command: >-
  bash -lc 'uv sync --frozen --no-default-groups
  --extra hf --extra s3 --extra clients
  && uv pip install torch peft accelerate safetensors
  && export PYTHONPATH=SteeringVectors:.
  && export EDULLM_LAUNCH_CHECK=waived
  && python SteeringVectors/generate_steering_vector.py
  --manifest SteeringVectors/checkpoints_qwen30b-thinking.json
  --dataset stereoset --layers 24 --max-statements 200
  --results-s3 "$EDULLM_OUTPUT_PREFIX"
  --run-name qwen30b-steering-smoke
  --device cuda:0 --dtype bfloat16 --device-map auto --attn-implementation sdpa'
