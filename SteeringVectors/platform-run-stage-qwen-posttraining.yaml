# eduLLM CPU job: copy Qwen checkpoint from post-training run → eval-inference runs/.
#
# Prefer sb_aws locally when the source is under teams/post-training/ (cross-team
# reads are not guaranteed on the platform workload role). Example:
#
#   ./SteeringVectors/stage_checkpoints.sh \
#     s3://sbsandbox-intern-edullm-outputs/teams/post-training/runs/run_019ff751-32b5-705e-b178-44096904a29f/checkpoints/ \
#     s3://sbsandbox-intern-edullm-outputs/teams/eval-inference/runs/qwen30b-thinking-staged/final/
#
# Submit only if the platform role can list the source prefix:
#   edullm submit --dataset none --hours 1 --experiment qwen30b-stage-posttraining \
#     --spec SteeringVectors/platform-run-stage-qwen-posttraining.yaml
schema_version: 1
workload_profile: olmo-eval-check
suggested_compute: cpu-32vcpu
command: >-
  bash -lc 'uv sync --frozen --no-default-groups --extra s3
  && export PYTHONPATH=SteeringVectors:.
  && python SteeringVectors/stage_checkpoints.py
  --source s3://sbsandbox-intern-edullm-outputs/teams/post-training/runs/run_019ff751-32b5-705e-b178-44096904a29f/checkpoints/
  --dest s3://sbsandbox-intern-edullm-outputs/teams/eval-inference/runs/qwen30b-thinking-staged/final/
  --manifest-out "$EDULLM_OUTPUT_PREFIX/qwen30b-stage-posttraining/manifest.json"'
