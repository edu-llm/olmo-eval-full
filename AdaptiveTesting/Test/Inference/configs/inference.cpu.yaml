# CPU / multi-machine HF sweep (no vLLM, no judge).
backend: hf
max_samples: 2000
sample_seed: 1234
writer:
  fsync_every_rows: 25
  fsync_every_seconds: 10
vllm: {}  # unused on CPU
generation:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 512
  seed: 1234
overrides:
  tutorbench:
    max_tokens: 768
  tutoreval:
    max_tokens: 768
  bridge:
    max_tokens: 512
  wildbench:
    max_tokens: 1024
  biggen:
    max_tokens: 1024
  ifeval:
    max_tokens: 1024
  infobench:
    max_tokens: 1024
  edubench:
    max_tokens: 768
