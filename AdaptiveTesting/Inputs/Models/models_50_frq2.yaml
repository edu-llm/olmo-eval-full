# 50 unused 0-3B checkpoints, high-confidence for the FRQ sweep.
#
# Selection basis: every architecture below already produced complete FRQ output
# in the full200 run (proven load+generate on the L4 / vLLM 0.19 stack):
#   Llama, Qwen2/2.5/1.5, OLMo/OLMo2, Gemma/Gemma2, StableLM, Granite3, Phi, MiniCPM, EXAONE.
# Qwen3 + DeepSeek distills are same-lineage/vLLM-supported (validated by smoke test).
# Excluded: families that produced NO output in full200 (OPT, BLOOM, GPT-2/openai,
#   XGLM, CodeGen, MobileLLM, SmolLM-v1-360M cache-fail) and P6-failed families
#   (phi-2, danube3, tinyllama, mamba, bitnet). None of these 50 are in models_200.yaml.
# params_b and arch verified from each repo's safetensors + config.json.

defaults:
  dtype: bfloat16
  trust_remote_code: true
  tp: 1
  apply_chat_template: null
  scoring_method: loglikelihood

models:
  - {id: Qwen/Qwen2.5-0.5B, params_b: 0.494, family: Qwen2.5, arch: transformer}
  - {id: Qwen/Qwen2-0.5B-Instruct, params_b: 0.494, family: Qwen2, arch: transformer}
