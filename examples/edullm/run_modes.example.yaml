# Template only. Replace every YOUR_* value and all illustrative CAT settings
# with the approved benchmark-specific artifacts and policy before running.
schema_version: olmo-eval-mode-config-v1
run_id: YOUR_UNIQUE_RUN_ID
output_dir: /path/to/new/results/YOUR_UNIQUE_RUN_ID
continue_on_mode_failure: true
metadata:
  benchmark: YOUR_BENCHMARK
  bank_release: YOUR_FITTED_BANK_RELEASE

harness:
  name: edullm-integrated
  provider:
    kind: vllm_server
    model: YOUR_CANDIDATE_CHECKPOINT
    revision: YOUR_IMMUTABLE_CANDIDATE_REVISION
    dtype: bfloat16
    max_model_len: 32768
    num_instances: 1
    kwargs:
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.9
  auxiliary_providers:
    judge:
      kind: vllm_server
      model: Qwen/Qwen3.5-9B
      revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
      tokenizer: Qwen/Qwen3.5-9B
      dtype: bfloat16
      max_model_len: 32768
      trust_remote_code: false
      num_instances: 1
      kwargs:
        language_model_only: true
        tensor_parallel_size: 1
        gpu_memory_utilization: 0.9
        chat_template_kwargs:
          enable_thinking: false

modes:
  - name: standard_olmo
    config:
      task_specs:
        - YOUR_OLMO_TASK_OR_SUITE
      save_predictions: true
      save_requests: true
      shuffle_seed: 42

  - name: edullm_adaptive
    config:
      schema_version: edullm-adaptive-mode-config-v1
      bank:
        rubrics_path: /path/to/fitted_bank/rubrics.json
        scenarios_path: /path/to/fitted_bank/scenarios.json
        manifest_path: /path/to/fitted_bank/manifest.json
        skills_order:
          - YOUR_SKILL_1
        benchmark_id: YOUR_BENCHMARK
        calibration_version: YOUR_CALIBRATION_VERSION
        policy_id: YOUR_APPROVED_CAT_POLICY
        scientific_status: experimental
      tutor:
        expected_model: YOUR_CANDIDATE_CHECKPOINT
        model_family: YOUR_MODEL_FAMILY
        model_provenance:
          source: olmo_eval_harness_provider
          revision: YOUR_IMMUTABLE_CANDIDATE_REVISION
        generation:
          max_tokens: 4096
          temperature: 0.0
          top_p: 1.0
          top_k: null
          stop_sequences: null
          num_samples: 1
          do_sample: false
      judge:
        provider: judge
        model: Qwen/Qwen3.5-9B
        model_family: qwen
        revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
        prompt_version: local-judge-v4.3.1-curated
        adapter_version: atomic-json-v4
        enable_thinking: false
        language_model_only: true
        pass_token_ids: [47, 387, 9729]
        fail_token_ids: [37, 426, 12362]
        failure_probability_threshold: 0.33
        atomic_requirement_policy: criterion_as_single_atomic_unless_curation_finalized
      quadrature:
        nodes_per_dim: 21
        max_nodes: 200000
        method: gauss_hermite
        linear_bound: 8.0
      cat:
        # Illustrative only: replace with the approved policy for this bank.
        max_se: 0.25
        min_evals_per_skill: 0
        min_scenarios: 5
        max_scenarios: 50
        seed: 42
        top_n: 5
        selection: trace
        stop_se_method: eap
        theta_init: null
        covariance_init_diag: null
        mwle_ridge: 0.000001
